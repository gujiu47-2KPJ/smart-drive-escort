[env:freenove_s3]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino

; N16R8 是 16MB Flash，板定义默认是 8MB，这里覆盖
board_upload.flash_size = 16MB

; CameraWebServer 固件 ~1.5MB，默认分区装不下，用 3MB app 的 Huge APP
board_build.partitions = huge_app.csv

monitor_speed = 115200

lib_deps =
    esp32-camera
